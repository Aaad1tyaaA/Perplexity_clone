<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sift — answers with sources</title>
    <meta name="description" content="An answer engine: searches the web, reads the sources, and writes a cited answer." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f4f1ea'/%3E%3Ccircle cx='9' cy='11' r='3.5' fill='%231f5e4e'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%231f5e4e' opacity='.6'/%3E%3Ccircle cx='23' cy='21' r='3.5' fill='%231f5e4e' opacity='.3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css?v=1" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="/static/app.js?v=1" defer></script>
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand" id="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Sift</a>
        <button id="new-thread" class="btn-quiet hidden" type="button">New thread</button>
    </header>

    <!-- Home -->
    <main id="home" class="home">
        <h1>Ask anything.<br><em>Get it sourced.</em></h1>
        <p class="lead">Sift searches the web, reads the pages, and writes an answer where every claim points back to where it came from.</p>

        <form class="ask-box" id="home-form">
            <textarea id="home-input" rows="2" placeholder="What do you want to know?" autofocus></textarea>
            <div class="ask-foot">
                <span class="mono-hint">Enter to search · Shift+Enter for a new line</span>
                <button class="btn-go" type="submit" aria-label="Search">Search <span aria-hidden="true">→</span></button>
            </div>
        </form>

        <div class="examples">
            <p class="label">Try</p>
            <button type="button">How does Rayleigh scattering make the sky blue?</button>
            <button type="button">What changed in the latest Python release?</button>
            <button type="button">Is intermittent fasting better than calorie counting?</button>
        </div>

        <section id="recent" class="recent hidden">
            <p class="label">Recent threads</p>
            <ul id="recent-list"></ul>
        </section>
    </main>

    <!-- Thread -->
    <main id="thread" class="thread hidden">
        <div id="turns"></div>
        <form class="ask-box follow" id="follow-form">
            <textarea id="follow-input" rows="1" placeholder="Ask a follow-up"></textarea>
            <button class="btn-go icon" type="submit" aria-label="Ask"><span aria-hidden="true">→</span></button>
        </form>
    </main>

    <template id="turn-tpl">
        <article class="turn">
            <h2 class="question"></h2>
            <section class="block sources-block">
                <p class="label">Sources</p>
                <ol class="sources"></ol>
            </section>
            <section class="block answer-block">
                <div class="label-row"><p class="label">Answer</p><button class="copy hidden" type="button">Copy</button></div>
                <div class="answer"></div>
            </section>
            <section class="block related-block hidden">
                <p class="label">Related</p>
                <ul class="related"></ul>
            </section>
        </article>
    </template>
</body>
</html>
